name: Bump plugin version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect plugin changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            plugins:
              - 'plugins/**'

      - name: Bump plugin versions
        if: steps.filter.outputs.plugins == 'true'
        run: |
          bash .githooks/bump-versions.sh

          MARKETPLACE_FILE=".claude-plugin/marketplace.json"
          git config user.name "${{ github.event.head_commit.author.name }}"
          git config user.email "${{ github.event.head_commit.author.email }}"
          git add "$MARKETPLACE_FILE"
          git diff --cached --quiet || (
            git commit -m "chore: bump plugin version(s)"
            git push
          )
