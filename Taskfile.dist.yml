# https://taskfile.dev
version: "3"

silent: true

vars:
  MARKETPLACE_NAME: specs
  MARKETPLACE_REPO: specsnl/agent-specs

tasks:
  marketplace:add:
    desc: Add this marketplace to Claude
    cmds:
      - task: marketplace:add:claude

  marketplace:add:repo:
    desc: Add this marketplace using the remote repository
    cmds:
      - echo ">> Adding marketplace to Claude..."
      - claude plugin marketplace add {{.MARKETPLACE_REPO}}

  marketplace:add:claude:
    desc: Add this marketplace to Claude
    internal: true
    preconditions:
      - sh: command -v claude
        msg: "Claude is not installed. Please install Claude to add this marketplace."
    cmds:
      - echo ">> Adding marketplace to Claude..."
      - claude plugin marketplace add ./

  marketplace:remove:
    desc: Remove this marketplace from Claude
    cmds:
      - task: marketplace:remove:claude

  marketplace:remove:claude:
    desc: Remove this marketplace from Claude
    internal: true
    preconditions:
      - sh: command -v claude
        msg: "Claude is not installed. Please install Claude to add this marketplace."
    cmds:
      - echo ">> Removing marketplace from Claude..."
      - cmd: claude plugin marketplace remove {{.MARKETPLACE_NAME}}
        ignore_error: true

  marketplace:reset:
    desc: Reset this marketplace in Claude
    cmds:
      - task: marketplace:remove
      - task: marketplace:add

  plugin:list:
    desc: List available plugins
    cmds:
      - claude plugin marketplace browse specs

  marketplace:update:
    desc: Update this marketplace in Claude
    cmds:
      - claude plugin marketplace update {{.MARKETPLACE_NAME}}

  plugin:install:*:
    desc: Install a plugin in Claude
    vars:
      PLUGIN: '{{index .MATCH 0}}'
    cmds:
      - claude plugin install {{.PLUGIN}}@{{.MARKETPLACE_NAME}}

  hooks:install:
    desc: Install git hooks
    cmds:
      - cp .githooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - echo ">> Git hooks installed"

  hooks:uninstall:
    desc: Uninstall git hooks
    cmds:
      - rm -f .git/hooks/pre-commit
      - echo ">> Git hooks uninstalled"
