# https://taskfile.dev
version: "3"

silent: true

tasks:
  marketplace:add:
    desc: Add this marketplace to Claude and Copilot
    cmds:
      - task: marketplace:add:claude
      - task: marketplace:add:copilot

  marketplace:add:repo:
    desc: Add this marketplace using the remote repository
    cmds:
      - echo ">> Adding marketplace to Claude..."
      - claude plugin marketplace add specsnl/agent-specs
      - echo ">> Adding marketplace to Copilot..."
      - cmd: copilot plugin marketplace add specsnl/agent-specs
        ignore_error: true

  marketplace:add:claude:
    desc: Add this marketplace to Claude
    internal: true
    preconditions:
      - sh: command -v claude
        msg: "Claude is not installed. Please install Claude to add this marketplace."
    cmds:
      - echo ">> Adding marketplace to Claude..."
      - claude plugin marketplace add ./

  marketplace:add:copilot:
    desc: Add this marketplace to Copilot
    internal: true
    preconditions:
      - sh: command -v copilot
        msg: "Copilot is not installed. Please install Copilot to add this marketplace."
    cmds:
      - echo ">> Adding marketplace to Copilot..."
      - cmd: copilot plugin marketplace add ./
        ignore_error: true

  marketplace:remove:
    desc: Remove this marketplace from Claude and Copilot
    cmds:
      - task: marketplace:remove:claude
      - task: marketplace:remove:copilot

  marketplace:remove:claude:
    desc: Remove this marketplace from Claude
    internal: true
    preconditions:
      - sh: command -v claude
        msg: "Claude is not installed. Please install Claude to add this marketplace."
    cmds:
      - echo ">> Removing marketplace from Claude..."
      - cmd: claude plugin marketplace remove specs
        ignore_error: true

  marketplace:remove:copilot:
    desc: Remove this marketplace from Copilot
    internal: true
    preconditions:
      - sh: command -v copilot
        msg: "Copilot is not installed. Please install Copilot to add this marketplace."
    cmds:
      - echo ">> Removing marketplace from Copilot..."
      - cmd: copilot plugin marketplace remove specs --force
        ignore_error: true

  marketplace:reset:
    desc: Reset this marketplace in Claude and Copilot
    cmds:
      - task: marketplace:remove
      - task: marketplace:add

  marketplace:update:
    desc: Update this marketplace in Claude and Copilot
    cmds:
      - claude plugin marketplace update specs
      -

  plugin:install:laravel:
    desc: Install the Laravel plugin in Claude and Copilot
    cmds:
      - claude plugin install laravel@specs
      - copilot plugin install laravel@specs

  hooks:install:
    desc: Install git hooks
    cmds:
      - cp .githooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - echo ">> Git hooks installed"

  hooks:uninstall:
    desc: Uninstall git hooks
    cmds:
      - rm -f .git/hooks/pre-commit
      - echo ">> Git hooks uninstalled"
